<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="100%" stop-color="#6b48ff"/>
    </linearGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff922b"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角方块 -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 水波纹装饰 -->
  <ellipse cx="256" cy="400" rx="160" ry="16" fill="rgba(255,255,255,0.08)"/>
  <ellipse cx="256" cy="430" rx="120" ry="12" fill="rgba(255,255,255,0.05)"/>

  <!-- 鱼身体 -->
  <ellipse cx="248" cy="240" rx="130" ry="80" fill="url(#fish)" opacity="0.95"/>

  <!-- 鱼尾巴 -->
  <path d="M370,240 L430,170 L420,240 L430,310 Z" fill="url(#tail)" opacity="0.9"/>

  <!-- 鱼鳍（上） -->
  <path d="M220,165 Q250,110 290,160" fill="rgba(255,255,255,0.5)" stroke="none"/>

  <!-- 鱼鳍（下） -->
  <path d="M230,315 Q255,355 280,318" fill="rgba(255,255,255,0.4)" stroke="none"/>

  <!-- 鱼眼白 -->
  <circle cx="195" cy="225" r="22" fill="#4f8cff"/>
  <!-- 鱼眼珠 -->
  <circle cx="190" cy="222" r="12" fill="#1a1a2e"/>
  <!-- 鱼眼高光 -->
  <circle cx="185" cy="217" r="5" fill="#fff"/>

  <!-- 鱼嘴 -->
  <path d="M125,245 Q140,260 155,248" fill="none" stroke="#4f8cff" stroke-width="4" stroke-linecap="round"/>

  <!-- 鱼鳞纹理 -->
  <path d="M220,200 Q240,210 220,230" fill="none" stroke="rgba(79,140,255,0.2)" stroke-width="2"/>
  <path d="M250,195 Q270,205 250,225" fill="none" stroke="rgba(79,140,255,0.2)" stroke-width="2"/>
  <path d="M280,200 Q300,210 280,230" fill="none" stroke="rgba(79,140,255,0.2)" stroke-width="2"/>
  <path d="M235,230 Q255,240 235,260" fill="none" stroke="rgba(79,140,255,0.15)" stroke-width="2"/>
  <path d="M265,225 Q285,235 265,255" fill="none" stroke="rgba(79,140,255,0.15)" stroke-width="2"/>

  <!-- 气泡 -->
  <circle cx="160" cy="170" r="8" fill="rgba(255,255,255,0.3)"/>
  <circle cx="140" cy="145" r="5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="155" cy="125" r="3" fill="rgba(255,255,255,0.15)"/>

  <!-- 运动符号：小汗滴 -->
  <path d="M320,175 Q325,160 330,175 Q325,182 320,175Z" fill="rgba(255,255,255,0.6)"/>
</svg>
